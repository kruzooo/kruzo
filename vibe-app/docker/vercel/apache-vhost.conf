<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    # Allow existing browser cookies through once so Laravel can replace the
    # former oversized cookie session with a small database session id.
    LimitRequestFieldSize 32768
    LimitRequestFields 100

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
